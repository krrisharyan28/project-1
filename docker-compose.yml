# Local dev infrastructure for the AI Fraud Alert Dashboard.
# Brings up PostgreSQL and Ollama (with the llama3 model) so the backend has
# both of its required services available. Portfolio/dev use only.
#
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3   # first run, downloads model
#
services:
  db:
    image: postgres:15-alpine
    container_name: fraud_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraud_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-fraud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraud}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: fraud_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # After the container is up, pull the model once:
    #   docker compose exec ollama ollama pull llama3

volumes:
  pgdata:
  ollama:
