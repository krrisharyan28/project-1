# SonarQube configuration for the AI Fraud Alert Dashboard.
# Run with:  sonar-scanner   (after `docker run sonarqube` or SonarCloud setup)

sonar.projectKey=ai-fraud-alert-dashboard
sonar.projectName=AI Fraud Alert Dashboard
sonar.projectVersion=1.0

# Source roots
sonar.sources=backend/apps,backend/common,backend/config,frontend/src

# Tests
sonar.tests=backend/apps,frontend/src
sonar.test.inclusions=**/tests/**,**/*.test.js,**/*.test.jsx

# Language-specific settings
sonar.python.version=3.13
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclusions: generated / vendored code should not be analyzed
sonar.exclusions=\
  **/migrations/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/staticfiles/**,\
  **/__pycache__/**,\
  backend/manage.py

sonar.sourceEncoding=UTF-8
